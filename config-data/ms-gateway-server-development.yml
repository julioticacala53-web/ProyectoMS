server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ms-catalogo-service
              uri: lb://ms-catalogo-service
              predicates:
                - Path=/categoria/**
            - id: ms-producto-service
              uri: lb://ms-producto-service
              predicates:
                - Path=/producto/**
